name: Build Gram APK

on:
  push:
    branches: [ "claude/grammar-correction-android-app-dqjkB", "main" ]
    paths:
      - "Gram/**"
  workflow_dispatch:          # allow manual trigger from the Actions tab

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > Gram/local.properties
          echo "CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}" >> Gram/local.properties

      - name: Grant gradlew permission
        run: chmod +x Gram/gradlew

      - name: Build debug APK
        working-directory: Gram
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gram-debug-apk
          path: Gram/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
